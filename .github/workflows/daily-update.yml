name: Daily Data Update

on:
  schedule:
    # 每天早上 00:00 UTC (北京时间 8:00) 运行
    - cron: '0 0 * * *'
  # 允许你手动点击按钮触发 (方便测试)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Fetch Script
      env:
        # 需要在 GitHub Secrets 里配置以下变量
        GITHUB_TOKEN: ${{ secrets.GH_TOKEN }} 
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        OPENAI_MODEL_ID: ${{ secrets.OPENAI_MODEL_ID || 'gemini-3-flash-preview' }}
        BATCH_SIZE: ${{ secrets.BATCH_SIZE || 8 }}
        MAX_RETRIES: ${{ secrets.MAX_RETRIES || 5 }}
        DATABASE_PATH: ${{ secrets.DATABASE_PATH || 'data/tools.db' }}
        UPDATE_MODE: ${{ secrets.UPDATE_MODE || 'incremental' }}
      run: |
        echo "🕷️ Starting crawler..."
        node scripts/fetch-github-data.js
        echo "✅ Data fetch complete."

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
        
        # 检查 data/tools.db 是否有变化
        if [[ -n $(git status --porcelain data/tools.db) ]]; then
          echo "📦 Database changed. Committing..."
          git add data/tools.db
          git commit -m "chore(data): auto-update tools database [skip ci]"
          
          # 拉取最新代码以避免冲突 (虽说是定时任务，但是个好习惯)
          git pull --rebase
          git push
        else
          echo "💤 No changes detected."
        fi